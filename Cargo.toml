[workspace]
resolver = "2"
members = [
    "src-tauri",
    "src-tauri/crates/oi-core",
    "integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "GPL-3.0-or-later"
repository = "https://github.com/oi-linux/oi-linux"
authors = ["OI Linux Contributors"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "local-time"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
bytes = "1"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
russh = { version = "0.54", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2"
ssh-key = { version = "0.6", features = ["ed25519", "rand_core"] }
tempfile = "3"
glob = "0.3"
libc = "0.2"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
semver = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
