name: windows-integration

# The blocking acceptance suites of `OILinux_PRD.md` §11.2, §11.3 and §11.4 on Windows, without
# hardware virtualisation (TCG). WHPX is not assumed on shared runners; it stays a release-time
# check on dedicated hardware.
#
# The base image is a release artefact (`vm/base-image.json`): CI downloads the published image
# and verifies its SHA-256 instead of rebuilding it, which keeps the wall clock at the cost of the
# suites themselves. The suites boot a real guest and compile real programs under TCG, so they run
# as a parallel matrix with binaries that were compiled once.
#
# Every run also builds the complete offline installer of `OILinux_PRD.md` §10.1 and uploads it as
# the `oi-linux-installer` artefact, so any commit can be installed and tried out without cutting a
# release; `release.yml` publishes the same bytes from the same staged resources when a tag lands.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  OI_LINUX_QEMU: C:\Program Files\qemu\qemu-system-x86_64.exe
  OI_TEST_DIR: D:\oi-linux-tests
  RUST_LOG: warn

jobs:
  binaries:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the acceptance binaries
        run: cargo build -p oi-integration-tests --bins
      - uses: actions/upload-artifact@v4
        with:
          name: oi-acceptance-binaries
          path: target/debug/*.exe
          retention-days: 7

  unit:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Front-end build (the Tauri crate embeds dist/)
        run: |
          npm ci
          npm run build
      - name: Unit tests
        run: cargo test --workspace

  image:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download the pinned base image
        shell: pwsh
        run: |
          $pin = Get-Content vm\base-image.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Force -Path vm\out | Out-Null
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $pin.url -OutFile vm\out\base.qcow2
          $actual = (Get-FileHash vm\out\base.qcow2 -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $pin.sha256) {
            throw "base image hash mismatch: $actual != $($pin.sha256)"
          }
          Set-Content -Path vm\out\base.qcow2.sha256 -Value $actual -NoNewline
          Write-Host "base image $actual"
      - uses: actions/upload-artifact@v4
        with:
          name: alpine-base-image
          path: |
            vm/out/base.qcow2
            vm/out/base.qcow2.sha256
          retention-days: 7

  acceptance:
    needs: [binaries, image]
    strategy:
      fail-fast: false
      matrix:
        suite: [ntfs-share, chmod-exec, boot-reset, upgrade-relink]
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        shell: pwsh
        run: |
          choco install qemu -y --no-progress
          & $env:OI_LINUX_QEMU --version

      - uses: actions/download-artifact@v4
        with:
          name: alpine-base-image
          path: vm/out

      - uses: actions/download-artifact@v4
        with:
          name: oi-acceptance-binaries
          path: target/debug

      - name: Run ${{ matrix.suite }}
        shell: pwsh
        run: |
          & ".\target\debug\${{ matrix.suite }}.exe"
          if ($LASTEXITCODE -ne 0) { throw "${{ matrix.suite }} failed with exit code $LASTEXITCODE" }

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.suite }}
          path: D:\oi-linux-tests\**\*.log
          retention-days: 14
          if-no-files-found: ignore

  installer:
    # The offline installer of §10.1 with QEMU, the verified base image, the WebView2 offline
    # installer and the licence inventory staged into the bundle. It waits for the unit tests and
    # the verified image (`dist/` and the engine are what gets embedded) but runs beside the
    # acceptance matrix: a bundle is also what a failing commit needs to be looked at.
    needs: [unit, image]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: alpine-base-image
          path: vm/out

      - name: Install QEMU for the bundle
        shell: pwsh
        run: |
          choco install qemu -y --no-progress
          & "C:\Program Files\qemu\qemu-system-x86_64.exe" --version

      # The evergreen link is the one Microsoft documents for the standalone installer; its payload
      # changes with every runtime release, so the signer is what gets verified, not a pinned hash.
      - name: Download the WebView2 offline installer
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile $out
          $signature = Get-AuthenticodeSignature $out
          if ($signature.Status -ne 'Valid') { throw "the WebView2 installer is not signed: $($signature.Status)" }
          if ($signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "the WebView2 installer is signed by $($signature.SignerCertificate.Subject)"
          }
          Write-Host "WebView2 $((Get-Item $out).Length) bytes, $($signature.SignerCertificate.Subject)"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: installer
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stage the bundled resources
        shell: pwsh
        run: |
          scripts\stage-resources.ps1 `
            -QemuDir 'C:\Program Files\qemu' `
            -BaseImage vm\out\base.qcow2 `
            -WebView2 (Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2RuntimeInstallerX64.exe')

      - name: Build the installer
        shell: pwsh
        env:
          OI_LINUX_UPDATE_PUBKEY: ${{ vars.OI_LINUX_UPDATE_PUBKEY }}
        run: |
          npm ci
          npm run tauri build

      - name: Collect the artefacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item target\release\bundle\nsis\*.exe artifacts\ -ErrorAction SilentlyContinue
          if (-not (Get-ChildItem artifacts\*.exe)) { throw 'the bundle produced no NSIS installer' }
          Get-ChildItem artifacts\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File "$($_.FullName).sha256" -Encoding ascii
            Write-Host "$($_.Name) $([math]::Round($_.Length / 1MB)) MiB"
          }
          $info = [ordered]@{
            product     = 'OI Linux'
            version     = (Get-Content package.json -Raw | ConvertFrom-Json).version
            alpine      = (Select-String -Path src-tauri\crates\oi-core\src\lib.rs -Pattern 'ALPINE_VERSION: &str = "([^"]+)"').Matches.Groups[1].Value
            base_sha256 = (Get-Content vm\out\base.qcow2.sha256 -Raw).Trim()
            channel     = 'ci'
            built_at    = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            commit      = '${{ github.sha }}'
          }
          $info | ConvertTo-Json | Out-File artifacts\build-info.json -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: oi-linux-installer
          path: |
            artifacts/*.exe
            artifacts/*.sha256
            artifacts/build-info.json
          # the NSIS package carries already-compressed payloads
          compression-level: 0
          retention-days: 30
